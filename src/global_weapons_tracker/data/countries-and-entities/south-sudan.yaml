name: South Sudan
code: SS
region: East Africa

producers:
  - name: Defense Industries Holding Company South Sudan (DIHCSS)
    type: state_owned
    products:
      - Garment and footwear (planned)
      - Vehicle assembly (planned)
      - Ammunition and explosives (planned)
      - Ship building (planned)
    employees: 50
    notes: Founded 2020; planning stage only — no active production. Mandate to attract investors.

top_import_sources:
  - country: United Arab Emirates
    notes: Armored vehicles (150 delivered in 2022 despite UN embargo)
  - country: Ukraine
    notes: Mi-24V attack helicopters (pre-2018 embargo)
  - country: Turkey
    notes: BRG-55 rifles, HUSAN MKA 556 rifles (diverted via illicit trade)

