name: Ethiopia
code: ET
region: East Africa

producers:
  - name: Metals and Engineering Corporation (METEC)
    type: state_owned
    products:
      - Small arms (AK-47 rifles, PK machine guns)
      - Mortars and artillery ammunition
      - T-55, T-62, T-72 tank overhaul and assembly
      - Armored vehicle repair and upgrade
      - Ammunition (Homicho Ammunition Engineering Complex)
      - UAVs (via SkyWin Aeronautics subsidiary)
    revenue: 1.2B
    revenue_year: 2023
    employees: 12400

  - name: SkyWin Aeronautics Industries
    type: state_owned
    products:
      - Military and civilian unmanned aerial vehicles
      - Reconnaissance drones
    employees: 500
    notes: Inaugurated March 2025; part of METEC

  - name: Homicho Ammunition Engineering Complex
    type: state_owned
    products:
      - Kalashnikov rifle ammunition
      - DShK heavy machine gun ammunition
      - Sniper rifle ammunition
      - Tank artillery ammunition
      - Mortar rounds
    employees: 2000
    notes: Opened March 2025; $30M+ in export deals in first 3 months

top_import_sources:
  - country: China
    notes: Wing Loong drones, armored vehicles, small arms
  - country: Russia
    notes: Mi-24 helicopters, tanks, legacy systems
  - country: Turkey
    notes: Bayraktar TB2 combat drones ($95M in 2021)

sources:
  - { name: "SIPRI Arms Transfers Database", url: "https://www.sipri.org/databases/armstransfers" }
