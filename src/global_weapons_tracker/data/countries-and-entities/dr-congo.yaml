    notes: Katmerciler armored vehicles, MKE munitions partnership, Bayraktar TB2 drones
  - country: United Arab Emirates
    notes: IGG armored vehicles, MRAPs
  - country: South Africa
    notes: Milkor 380 drones
  - country: Bulgaria
    notes: Second-hand tanks, light weapons, ammunition
  - country: Serbia
    notes: Second-hand tanks, ammunition

