name: DR Congo
code: CD
region: Central Africa

producers:
  - name: Africaine d'Explosifs (AFRIDEX)
    type: state_owned
    products:
      - Military explosives
      - Small arms ammunition
      - Small and large caliber weapons
      - Hunting weapons
      - Civilian mining explosives
    employees: 1500
    notes: Founded 1948; Likasi military-industrial complex under construction with Norinco (China) and MKE (Turkey)

top_import_sources:
