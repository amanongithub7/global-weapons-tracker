  - { name: "Wikipedia — Yarmouk Military Industrial Complex", url: "https://en.wikipedia.org/wiki/Yarmouk_Military_Industrial_Complex" }
  - { name: "Defence Industries System (MASAD) official site", url: "https://mic-sd.com/" }
  - { name: "Atyaf Industrial Complex official site", url: "https://atyafcomplex.com/" }
