name: Africaine d'Explosifs (AFRIDEX)
country: DR Congo
type: state_owned
founded: 1948

key_programs:
  - name: Likasi Military-Industrial Complex
    type: explosives_and_munitions
    status: under_construction
    description: Multi-factory complex for production of military explosives, small and large caliber weapons, and munitions. Built in partnership with Norinco (China) and MKE (Turkey). Operations expected by late 2025.

  - name: Small Arms Production
    type: small_arms
    status: active_production
    description: Manufacture of small caliber weapons and hunting arms

  - name: Civil Explosives
    type: explosives
    status: active_production
    description: Industrial explosives for mining and quarrying

suppliers:
  - name: Norinco
    country: China
    supplies: Military equipment assembly technology, financing
    relationship: partner

  - name: MKE (Makine ve Kimya Endüstrisi)
    country: Turkey
    supplies: Munitions production technology, expertise
    relationship: partner

