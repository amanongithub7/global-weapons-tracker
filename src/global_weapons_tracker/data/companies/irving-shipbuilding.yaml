    relationship: tier_1

  - name: BAE Systems (UK)
    country: United Kingdom
    supplies: Type 26 frigate design for CSC program
    relationship: technology_partner

  - name: GE Power Conversion
    country: United Kingdom
    supplies: Integrated electric propulsion systems
    relationship: supplier

